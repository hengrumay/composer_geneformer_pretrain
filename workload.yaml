# workload.yaml (paste as-is)

experiment_name: geneformer-sgcli-mmt-test

workspace:
  host: https://e2-dogfood.staging.cloud.databricks.com/

repo_snapshot:
  local_repo_path: /Users/may.merkletan/Documents/Projects/Merck/composer_geneformer_pretrain

environment:
  dependencies: requirements.yaml
  env_variables:
    # --- MLflow + logging ---
    MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: "true"
    LOG_CHECKPOINTS_TO_MLFLOW: "true"

    # --- Torchrun topology toggle ---
    # Single-node 8×GPU (default): set NNODES=1 (commands.sh auto-detects NPROC_PER_NODE=8)
    NNODES: "1"
    # Multi-node 1×GPU per host: uncomment below AND ensure the cluster actually provisions N hosts.
    #NNODES: "8"
    #NPROC_PER_NODE: "1"
    MASTER_PORT: "29400"

    # --- NCCL/Distributed (safe defaults for socket transport) ---
    NCCL_DEBUG: "WARN"
    NCCL_NET: "Socket"
    NCCL_IB_DISABLE: "1"
    NCCL_SOCKET_IFNAME: "eth"
    NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_TIMEOUT: "1800"
    TORCH_DISTRIBUTED_DEBUG: "DETAIL"
    TORCH_NCCL_BLOCKING_WAIT: "1"
    TORCH_DIST_INIT_BARRIER_TIMEOUT: "1800"

    # --- Dataloader workers ---
    DATALOADER_WORKERS: "4"

compute:
  # Default: single H100 box with 8 GPUs (NNODES=1).
  # If you switch to multi-node 1×GPU hosts, set NNODES accordingly and ensure the backend provisions enough hosts.
  gpus: 8
  gpu_type: h100

bash_script: sgcli_entrypoint.sh
max_retries: 0