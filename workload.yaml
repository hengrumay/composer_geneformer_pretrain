# workload.yaml (paste as-is)

experiment_name: geneformer-sgcli-mmt-test

workspace:
  host: https://e2-dogfood.staging.cloud.databricks.com/

repo_snapshot:
  local_repo_path: /Users/may.merkletan/Documents/Projects/Merck/composer_geneformer_pretrain

environment:
  dependencies: requirements.yaml
  env_variables:
    NCCL_DEBUG: "WARN"
    MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: "true"
    # If true, train.py will upload any saved checkpoints as MLflow artifacts (rank 0 only).
    LOG_CHECKPOINTS_TO_MLFLOW: "true"

    # Toggle NNODES here:
    # - Single node with 8 GPUs (default): NNODES=1 (torchrun --standalone, NPROC_PER_NODE auto-detects to 8)
    # - Multi-node with 1 GPU per host: set NNODES=8 (ensure cluster actually has 8 hosts)
    NNODES: "1"
    #NNODES: "8"     # uncomment for multi-node
    #NPROC_PER_NODE: "1"  # optional: fix per-host procs if you use multi-node 1×GPU hosts
    MASTER_PORT: "29400"

    # Keep DataLoader workers modest per rank (read in train.py)
    DATALOADER_WORKERS: "4"

    # Avoid OFI plugin warnings; force NCCL sockets
    NCCL_NET: "Socket"
    NCCL_IB_DISABLE: "1"

    # Strongly recommended to avoid DataLoader worker explosion:
    # you currently have num_workers=32 in train.py; with 8 ranks that would be 256 workers.
    # If you update train.py to read this env var, set it here.
    # DATALOADER_WORKERS: "4"

compute:
  # Intention: single H100 box with 8 GPUs (NNODES=1), or 8 hosts × 1 GPU each if NNODES=8.
  gpus: 8
  gpu_type: h100

bash_script: sgcli_entrypoint.sh
max_retries: 0