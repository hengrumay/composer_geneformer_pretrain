version: "4"
dependencies:
  # Testing mlflow>=3.6.0 with mosaicml (no [mlflow] extra)
  # Strategy:
  # 1. Install mosaicml WITHOUT [mlflow] extra (avoids mlflow<3.0 constraint)
  # 2. Install mlflow>=3.6.0 separately
  # 3. Force-reinstall torch 2.8 in commands.sh
  # Note: Some mlflow integration features may not work (Composer 0.32.1 tested against mlflow<3.0)
  - mosaicml==0.32.1
  - mlflow>=3.6.0
  - mosaicml-streaming==0.13.0
  - transformers==4.44.0
  - datasets==2.21.0
  - boto3
  - omegaconf
  - tqdm

# Note: torch 2.8 is force-reinstalled in commands.sh after mosaicml is installed
# This bypasses mosaicml's torch<2.7.1 constraint