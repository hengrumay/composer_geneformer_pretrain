# - experiment_name: Field required
# - environment: Field required
# - compute.gpu_type: Field required
# - compute.cluster: Extra inputs are not permitted
# - name: Extra inputs are not permitted
# - image: Extra inputs are not permitted
# - integrations: Extra inputs are not permitted
# - scheduling: Extra inputs are not permitted

experiment_name: sgcli_geneformer_torch27_test_h100_n16
# experiment_name: sgcli_geneformer_torch27_test_a10_n8
# experiment_name: sgcli_002_geneformer_mmt_h100_n16_composer
# experiment_name: sgcli_002_geneformer_mmt_a10_n8_composer
environment:
  env_variables:
    # Experiment name for checkpoint folder (derived from experiment_name)
    EXPT_NAME: ${experiment_name}
    # NCCL settings for multi-node H100 training
    NCCL_DEBUG: "INFO"
    NCCL_SOCKET_IFNAME: "eth"            # Use eth interfaces (auto-match eth0, eth1, etc.)
    NCCL_IB_DISABLE: "1"                 # Disable InfiniBand if not available
    NCCL_ASYNC_ERROR_HANDLING: "1"       # Better async error handling
    NCCL_TIMEOUT: "1800"                 # 30 min timeout for large barrier ops
    # PyTorch distributed settings
    TORCH_DISTRIBUTED_DEBUG: "DETAIL"    # More verbose debugging
    TORCH_NCCL_BLOCKING_WAIT: "1"        # Use blocking wait for better error reporting
    # Increase TCP store timeout for multi-node coordination
    TORCH_DIST_INIT_BARRIER_TIMEOUT: "1800"
    ## Topology guards | fast fail if not matching #turn off for now
    # EXPECT_NNODES: "2"
    # EXPECT_GPUS_PER_NODE: "8"
    # EXPECT_GPU_TYPE: "h100"
    # EXPECT_NNODES: "8"
    # EXPECT_GPUS_PER_NODE: "1"
    # EXPECT_GPU_TYPE: "a10"
  dependencies: dependencies.yaml
compute:
  gpus: 16
  gpu_type: h100  #Note: H100s may take longer to provision than A10s.
  # gpus: 8
  # gpu_type: a10
max_retries: 1
code_source:
  type: snapshot
  snapshot:
    # git_branch: git-branch-name
    # git_commit: commit-hash

    # repo_path: /Users/may.merkletan/Documents/Projects/Merck/composer_geneformer_pretrain_ref/composer_geneformer_pretrain/
    repo_path: /Users/may.merkletan/Documents/Projects/Merck/sgc_cli/composer_geneformer_pretrain/
command: |-
  echo ">>> Looking for code directory..."
  echo ">>> HOME contents:"
  ls -la $HOME
  cd $HOME/composer_geneformer_pretrain
  echo ">>> Now in: $(pwd)"
  echo ">>> Directory contents:"
  ls -la
  python -c "import torch; print(f'PyTorch version: {torch.__version__}')"
  echo ">>> Starting training"
  sh commands.sh
  export MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING=true
  composer train.py parameters.yaml