experiment_name: geneformer-sgcli-mmt-test

workspace:
  host: https://e2-dogfood.staging.cloud.databricks.com/

git_repo: https://github.com/hengrumay/composer_geneformer_pretrain.git
git_branch: mmt_sgc_cli_test

environment:
  dependencies: requirements.yaml
  env_variables:
    # --- MLflow + logging ---
    MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: "true"
    LOG_CHECKPOINTS_TO_MLFLOW: "true"
    # Enforce expected topology (fail fast if not met)
    EXPECT_NNODES: "2"
    EXPECT_GPUS_PER_NODE: "8"
    EXPECT_GPU_TYPE: "h100"

    # --- Torchrun topology toggle (pick one preset) ---
    # 1) Single-node 8×GPU (default):
    # NNODES: "1"
    # NPROC_PER_NODE: "8"   # optional; commands.sh auto-detects GPUs
    #
    # 2) Multi-node 1×GPU per host (example 8 hosts = 8 GPUs total):
    #NNODES: "8"
    #NPROC_PER_NODE: "1"
    #
    # 3) Multi-node 8×GPU per host (example 8 hosts × 2 GPUs = 16 GPUs total):
    NNODES: "2"
    NPROC_PER_NODE: "8"
    #
    # 4) Sanity probe: 2 nodes × 4 GPUs each (total 8 GPUs; minimum valid for h100)
    #NNODES: "8"
    # NPROC_PER_NODE: "2"
    MASTER_PORT: "29400"

    # Expose GPU type to the training script for run_name tagging.
    GPU_TYPE: "h100"

    # --- NCCL/Distributed (safe defaults for socket transport) ---
    NCCL_DEBUG: "WARN"
    NCCL_NET: "Socket"
    NCCL_IB_DISABLE: "1"
    NCCL_SOCKET_IFNAME: "eth"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_TIMEOUT: "1800"
    TORCH_DISTRIBUTED_DEBUG: "DETAIL"
    TORCH_NCCL_BLOCKING_WAIT: "1"
    TORCH_DIST_INIT_BARRIER_TIMEOUT: "1800"

    # --- Dataloader workers ---
    DATALOADER_WORKERS: "4"

compute:
  # Default single-node H100: set gpus to 8 (or multiples of 8 if you switch to multi-node).
  gpus: 16 #8
  gpu_type: h100

bash_script: sgcli_entrypoint.sh
max_retries: 0
