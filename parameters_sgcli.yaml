model_config:
  hidden_size: 256
  num_hidden_layers: 6
  initializer_range: 0.02
  layer_norm_eps: 1e-12
  attention_probs_dropout_prob: 0.02
  hidden_dropout_prob: 0.02
  intermediate_size: 512
  hidden_act: relu
  max_position_embeddings: 2048
  model_type: bert
  num_attention_heads: 4

fsdp_config:
  sharding_strategy: FULL_SHARD
  state_dict_type: full
  cpu_offload: False
  mixed_precision: DEFAULT
  backward_prefetch: BACKWARD_POST
  activation_checkpointing: False
  activation_cpu_offload: False
  verbose: True

scheduler:
  name: linear_decay_with_warmup
  t_warmup: 0.06dur
  alpha_f: 0.02

optimizer:
  name: decoupled_adamw
  lr: 5.0e-4
  betas: [0.9, 0.98]
  eps: 1.0e-06
  weight_decay: 1.0e-5

callbacks:
  speed_monitor:
    window_size: 500
  lr_monitor: {}
  memory_monitor: {}

loggers:
  mlflow:
    tracking_uri: databricks
    experiment_name: mlflow_experiments/geneformer_pretraining

device: gpu
seed_val: 42
run_name: geneformer_sgcli_mmt_test

working_dir: /pretrain/temp

# --- Data: use Unity Catalog Volumes (already materialized) ---
data_location: local
local_data_dir: /Volumes/main/srijit_nair/geneformer/data/dataset
token_dictionary_path: /Volumes/main/srijit_nair/geneformer/data/token_dictionary.pkl
streaming_dataset_location: streaming/genecorpus_30M_2048.dataset

mlm_probability: 0.15

# --- Training: keep small for smoke test ---
train_batch_size: 16
eval_batch_size: 16
device_train_microbatch_size: 16
train_subset_num_batches: 10
eval_subset_num_batches: 2
max_duration: 1ep
eval_interval: 1ep

progress_bar: false
log_to_console: true
console_log_interval: 1ba

autoresume: false

# Save checkpoints somewhere that doesn't require AWS creds
save_interval: 1ba # save every batch so it’s obvious | #1ep
save_num_checkpoints_to_keep: 1
save_overwrite: true
# Composer's UC object store expects Unity Catalog Volume paths to start with "Volumes"
# (no leading slash). Use a writable location in your UC Volume.
save_folder: Volumes/main/srijit_nair/geneformer/tmp/geneformer_sgcli_mmt_test/checkpoints

# --- Distributed (torchrun multi-node) ---
distributed:
  enabled: true
  mode: torchrun
  torchrun:
    nproc_per_node: 1
