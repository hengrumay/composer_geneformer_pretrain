# parameters_sgcli.yaml 

model_config:
  hidden_size: 256
  num_hidden_layers: 6
  initializer_range: 0.02
  layer_norm_eps: 1e-12
  attention_probs_dropout_prob: 0.02
  hidden_dropout_prob: 0.02
  intermediate_size: 512
  hidden_act: relu
  max_position_embeddings: 2048
  model_type: bert
  num_attention_heads: 4

# NOTE: For multi-worker serverless, prefer sharded checkpoints to avoid rank0 OOM.
fsdp_config:
  sharding_strategy: FULL_SHARD
  state_dict_type: sharded
  cpu_offload: False
  mixed_precision: DEFAULT
  backward_prefetch: BACKWARD_POST
  activation_checkpointing: False
  activation_cpu_offload: False
  verbose: True

scheduler:
  name: linear_decay_with_warmup
  t_warmup: 0.06dur
  alpha_f: 0.02

optimizer:
  name: decoupled_adamw
  lr: 5.0e-4
  betas: [0.9, 0.98]
  eps: 1.0e-06
  weight_decay: 1.0e-5

callbacks:
  speed_monitor:
    window_size: 500
  lr_monitor: {}
  memory_monitor: {}

loggers:
  mlflow:
    tracking_uri: databricks
    experiment_name: mlflow_experiments/geneformer_pretraining

# -----------------------------------------------------------------------------
# Distributed training control
#
# mode: "none" | "torchrun" | "serverless_gpu"
#
# serverless_gpu mode:
# - Uses Databricks Serverless GPU @distributed launcher (remote multi-worker)
# - DO NOT rely on NNODES/WORLD_SIZE env vars to decide topology
# - Your commands.sh should run "python train.py ..." and train.py should call
#   serverless_gpu.distributed(...).distributed()
# -----------------------------------------------------------------------------
distributed:
  enabled: true
  mode: serverless_gpu

  # This is ignored in serverless_gpu mode; safe to keep.
  torchrun:
    nproc_per_node: 1

  serverless_gpu:
    gpus: 8
    gpu_type: a10
    remote: true

    # Keep true if your train.py manually does dist.init_process_group("nccl")
    manual_init_process_group: true
    ddp_backend: nccl

# General
device: gpu
seed_val: 42
run_name: geneformer_sgcli_mmt_test
working_dir: /pretrain/temp

# --- Data: use Unity Catalog Volumes (already materialized) ---
data_location: local
local_data_dir: /Volumes/main/srijit_nair/geneformer/data/dataset
token_dictionary_path: /Volumes/main/srijit_nair/geneformer/data/token_dictionary.pkl
streaming_dataset_location: streaming/genecorpus_30M_2048.dataset

mlm_probability: 0.15

# --- Training: smoke test ---
# Per-rank batch sizes. Effective batch size = train_batch_size * world_size (8).
train_batch_size: 16
eval_batch_size: 16
device_train_microbatch_size: 16

train_subset_num_batches: 10
eval_subset_num_batches: 2

max_duration: 10ba
eval_interval: 10ba

progress_bar: false
log_to_console: true
console_log_interval: 1ba

autoresume: false

# Checkpointing
save_interval: 10ba
save_num_checkpoints_to_keep: 1
save_overwrite: true
save_folder: Volumes/main/srijit_nair/geneformer/tmp/geneformer_sgcli_mmt_test/checkpoints